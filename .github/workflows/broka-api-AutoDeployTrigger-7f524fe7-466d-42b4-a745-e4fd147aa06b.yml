name: Deploy BROKA API to Azure (manual legacy)

# Render is the production API host. Keep this legacy Azure workflow available
# for an intentional operator-run deployment, but never deploy to Azure on
# ordinary main-branch pushes.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BROKAAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BROKAAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BROKAAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy BROKA API
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          acrName: brokaproductionacr
          containerAppName: broka-api
          resourceGroup: broka-production
          imageToBuild: brokaproductionacr.azurecr.io/broka-api:${{ github.sha }}
