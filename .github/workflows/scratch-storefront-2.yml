# TEMPORARY - scratch branch only, deleted once the PR's own CI has run.
# The web checks CI runs (typecheck, lint, test, build) on the storefront
# 2.0 branch; the messages-navigation regression test against main's web
# code (it must fail there); then the production build served against a
# fixture API and driven in Chromium at phone, tablet and desktop widths
# for screenshots and measured layout checks. Results are pushed to a
# results branch of their own, which is deleted with this one.
name: scratch - storefront 2.0 checks and screenshots
on:
  push:
    branches: ['scratch/storefront-2']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BROKA_API_URL: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci && mkdir -p ../qa-out

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: set -o pipefail; npm run typecheck 2>&1 | tee ../qa-out/typecheck.txt

      - name: Lint
        id: lint
        continue-on-error: true
        run: set -o pipefail; npm run lint 2>&1 | tee ../qa-out/lint.txt

      - name: Test
        id: test
        continue-on-error: true
        run: set -o pipefail; npm test 2>&1 | tee ../qa-out/test.txt

      - name: Build
        id: build
        continue-on-error: true
        run: set -o pipefail; npm run build 2>&1 | tee ../qa-out/build.txt

      - name: Regression test against main's web code (must fail there)
        id: regression
        continue-on-error: true
        run: |
          cp "src/app/store/[name]/messages/page.test.tsx" "$RUNNER_TEMP/messages-page.test.tsx"
          git checkout origin/main -- src
          cp "$RUNNER_TEMP/messages-page.test.tsx" "src/app/store/[name]/messages/page.test.tsx"
          set +e
          npx vitest run messages/page.test -t "marks Messages as the section" > ../qa-out/regression-on-main.txt 2>&1
          code=$?
          set -e
          echo "vitest exit code on main's code: $code" | tee -a ../qa-out/regression-on-main.txt
          git checkout HEAD -- src
          git status --short
          test "$code" -ne 0

      - name: Serve the build against the fixture API
        if: steps.build.outcome == 'success'
        run: |
          node ../scratch/storefront-qa/mock-api.mjs > ../qa-out/mock-api.log 2>&1 &
          npx next start -p 3000 > ../qa-out/next.log 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:3000/store/clanix && break; sleep 1; done
          curl -s -o /dev/null -w "store page answered %{http_code}\n" http://127.0.0.1:3000/store/clanix

      - name: Screenshots and layout checks
        id: shots
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: scratch/storefront-qa
        env:
          OUT_DIR: ${{ github.workspace }}/qa-out
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter > /dev/null || true
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          set -o pipefail
          node shoot.mjs 2>&1 | tee "$OUT_DIR/shots.txt"

      - name: Verdict file
        if: always()
        run: |
          {
            echo "sha=${GITHUB_SHA}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "lint=${{ steps.lint.outcome }}"
            echo "test=${{ steps.test.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "regression_fails_on_main=${{ steps.regression.outcome }}"
            echo "screenshots=${{ steps.shots.outcome }}"
          } | tee ../qa-out/verdict.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-2-qa
          path: qa-out
          retention-days: 3

      - name: Publish the results to a branch of their own
        if: always()
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf results && mkdir results && cp -r "$GITHUB_WORKSPACE/qa-out/." results/
          cd results
          git init -q -b results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Storefront 2.0 QA results for ${GITHUB_SHA}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/scratch/storefront-2-results-${GITHUB_RUN_NUMBER}"

      - name: Fail when a check failed
        if: always()
        run: |
          test "${{ steps.typecheck.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
          test "${{ steps.test.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.regression.outcome }}" = success
