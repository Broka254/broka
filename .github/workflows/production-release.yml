name: BROKA Production Release

# This workflow runs only after the existing full CI workflow has completed
# successfully for a push to main. It then migrates Supabase and deploys the
# exact tested commit to Render. PR CI runs never receive production secrets.
on:
  workflow_run:
    workflows: ["BROKA CI — Test + Build APK"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: broka-production-release
  cancel-in-progress: false

jobs:
  release:
    name: Migrate Supabase, then deploy Render
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dbegua5g1s2s73fifsrg
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
      DB_CONNECT_TIMEOUT_SECONDS: "15"
      DB_COMMAND_TIMEOUT_SECONDS: "0"
      ENV: production
      BROKA_NATIVE: "off"

    outputs:
      release_commit: ${{ steps.guard.outputs.release_commit }}
    steps:
      - name: Check out the exact commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Reject stale CI runs
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tested_sha="${{ github.event.workflow_run.head_sha }}"
          current_main="$(git rev-parse origin/main)"
          if [ "$tested_sha" != "$current_main" ]; then
            # The existing CI workflow may append a graphify.md-only commit
            # using GITHUB_TOKEN after tests finish. That generated map does
            # not change application code. Any other newer change makes this
            # release stale and it must not migrate or deploy.
            changed_files="$(git diff --name-only "$tested_sha" origin/main)"
            if [ -z "$changed_files" ] || [ "$changed_files" != "graphify.md" ]; then
              echo "Skipping stale release: tested $tested_sha, current main is $current_main."
              printf 'Changes since tested commit:\n%s\n' "$changed_files"
              exit 1
            fi
            echo "Only the generated graphify.md changed after the tested commit; proceeding with tested code."
          fi
          echo "The tested application commit is current: $tested_sha"
          echo "release_commit=$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Validate production secrets and Render target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "::error::Missing SUPABASE_DATABASE_URL secret"; exit 1; }
          test -n "$RENDER_API_KEY" || { echo "::error::Missing RENDER_API_KEY secret"; exit 1; }
          python - <<'PY'
          import os, sys
          from urllib.parse import urlsplit
          try:
              u = urlsplit(os.environ["DATABASE_URL"])
              port = u.port
          except Exception:
              sys.exit("SUPABASE_DATABASE_URL is malformed.")
          if u.scheme not in {"postgres", "postgresql", "postgresql+asyncpg"}:
              sys.exit("DATABASE_URL must be a PostgreSQL URI.")
          if not u.hostname or not u.hostname.endswith(".pooler.supabase.com"):
              sys.exit("DATABASE_URL must use the Supabase Session Pooler.")
          if port != 5432:
              sys.exit("DATABASE_URL must use Session Pooler port 5432.")
          if u.username != "postgres.ydpbbosfttsnzpheowik":
              sys.exit("DATABASE_URL username does not match the BROKA Supabase project.")
          if u.path.rstrip("/") != "/postgres" or not u.password:
              sys.exit("DATABASE_URL must target the postgres database and include its password.")
          print("Supabase target validated.")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply the schema required by this exact commit
        working-directory: backend
        run: |
          python -u -m api.migrate
          python -u - <<'PY'
          import asyncio
          from api.database import SCHEMA_VERSION, engine, schema_status
          async def main():
              try:
                  status = await schema_status()
                  print(
                      f"Supabase schema: current={status['current_version']} "
                      f"required={SCHEMA_VERSION} ready={status['current']}"
                  )
                  if not status["current"]:
                      raise SystemExit("Supabase schema is not ready for this release.")
              finally:
                  await engine.dispose()
          asyncio.run(main())
          PY

      - name: Trigger Render deployment for the tested commit
        id: render
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --data "{\"commitId\":\"$GITHUB_SHA\",\"clearCache\":\"do_not_clear\"}")"
          deploy_id="$(printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or d.get("deploy",{}).get("id") or "")')"
          if [ -z "$deploy_id" ]; then
            echo "::error::Render accepted no identifiable deployment ID."
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Render deployment queued: $deploy_id"

      - name: Wait for Render to become live
        env:
          DEPLOY_ID: ${{ steps.render.outputs.deploy_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            response="$(curl --fail-with-body --silent --show-error \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer $RENDER_API_KEY")"
            status="$(printf '%s' "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status") or d.get("deploy",{}).get("status") or "unknown")')"
            echo "Render deploy status: $status (check $attempt/90)"
            case "$status" in
              live)
                echo "Render is live on commit $GITHUB_SHA."
                exit 0
                ;;
              build_failed|pre_deploy_failed|update_failed|canceled)
                echo "::error::Render deployment ended with status: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Render deployment $DEPLOY_ID."
          exit 1
