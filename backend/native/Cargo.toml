[package]
name = "broka_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Rust acceleration for the BROKA backend: linear-time chat scanning and batch geo math."
license = "UNLICENSED"
publish = false

[lib]
name = "broka_native"
# cdylib: the Python extension module. rlib: lets `cargo test` link the
# pure-Rust core without a Python interpreter.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The Python bindings. Off for `cargo test` (the core is plain Rust and needs
# no interpreter); maturin turns it on - see pyproject.toml.
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.29", optional = true, features = ["abi3-py311"] }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.25"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "unwind"
