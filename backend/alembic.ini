# BROKA - Alembic Configuration
# Run migrations: alembic upgrade head
# Create a new migration: alembic revision --autogenerate -m "describe change"
# Rollback one step: alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# DATABASE_URL is read from env in migrations/env.py
# Do not put credentials here
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
