pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    // FCM (calling-hardening pass). Version is a best-effort estimate from
    // training knowledge (not verified against a live Maven/Gradle Plugin
    // Portal - no network in this sandbox); bump if Gradle reports a
    // newer requirement. Applied conditionally in app/build.gradle, only
    // once a real google-services.json exists.
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
