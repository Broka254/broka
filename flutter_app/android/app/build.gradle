plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('app/key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.broka.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.broka.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "2.0.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
                storeFile     file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"

    // SMS Retriever API — lets the OTP screen read the verification SMS
    // addressed to this app with no SMS permission and no user prompt.
    // See SmsRetrieverBridge.kt. This is the phone-auth slice of Play
    // Services only, not the full auth artifact, so it adds very little.
    implementation "com.google.android.gms:play-services-auth-api-phone:18.1.0"

    // Theme.AppCompat for res/values/styles.xml (see the comment there).
    // Declared directly so the themes don't depend on what the plugins
    // happen to pull in.
    implementation "androidx.appcompat:appcompat:1.6.1"
}

// FCM (calling-hardening pass). This plugin hard-fails the build if
// google-services.json doesn't exist, so it's applied conditionally
// rather than unconditionally in the plugins {} block above - the app
// builds exactly as it does today until a real Firebase project's config
// file is dropped in here (see FCM_SETUP_REMAINING.md; this file is
// git-ignored and must never be committed). Same conditional-file pattern
// this project already uses for the release keystore, above.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
