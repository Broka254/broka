allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Workaround for Flutter 3.24.5: the flutter-plugin-loader only registers
// the `flutter` extension property on the :app module. Some plugins'
// android/build.gradle files read `flutter.compileSdkVersion` /
// `flutter.targetSdkVersion` / `flutter.ndkVersion` directly, assuming that
// extension exists on every subproject too — which only became guaranteed
// in Flutter 3.27+. This fails with:
//   "Could not get unknown property 'flutter' for extension 'android'"
// Confirmed affected plugins so far: geolocator_android, record_android.
// Add more names to the list below if other plugins hit the same error.
def pluginsNeedingFlutterExt = ["geolocator_android", "record_android"]

subprojects { subproject ->
    if (subproject.name in pluginsNeedingFlutterExt) {
        subproject.ext.flutter = new Object() {
            int compileSdkVersion = 36
            int targetSdkVersion = 36
            int minSdkVersion = 24
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
